name: Apply player polish

on:
  workflow_dispatch:
  push:
    paths:
      - player-polish.patch.gz.b64
      - .github/workflows/apply-player-polish.yml

permissions:
  contents: write

concurrency:
  group: apply-player-polish
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        run: |
          base64 --decode player-polish.patch.gz.b64 | gunzip > /tmp/player-polish.patch
          git apply --check /tmp/player-polish.patch
          git apply /tmp/player-polish.patch
          git rm player-polish.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LiveRefreshV12.module.css
          git commit -m "Polish dashboard visual system"
          git push
