name: Validate FPL Risk

on:
  push:
    branches:
      - main
      - feature/fpl-risk-v12-product-model
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Existing model invariants
        run: npm run model:check

      - name: Model v1.2 invariants
        run: npm run model:check:v12

      - name: Walk-forward backtest smoke test
        env:
          BACKTEST_SEASON: 2025-26
          BACKTEST_START_GW: 4
          BACKTEST_END_GW: 5
        run: npm run backtest

      - name: Production build
        run: npm run build
