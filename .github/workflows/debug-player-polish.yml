name: Debug player polish

on:
  workflow_dispatch:
  push:
    paths:
      - player-polish.patch.gz.b64

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect patch
        run: |
          set -euxo pipefail
          ls -l player-polish.patch.gz.b64 components/LiveRefreshV12.module.css
          wc -c player-polish.patch.gz.b64
          base64 --decode player-polish.patch.gz.b64 > /tmp/player-polish.patch.gz
          gzip -tv /tmp/player-polish.patch.gz
          gunzip -c /tmp/player-polish.patch.gz > /tmp/player-polish.patch
          wc -l /tmp/player-polish.patch
          git apply --check --verbose /tmp/player-polish.patch
